const { useState, useEffect, useRef } = React;

/* CSS string -> React style object (keeps the original design's inline styles verbatim) */
function css(str){
  const o = {};
  String(str).split(';').forEach(part => {
    const i = part.indexOf(':'); if (i < 0) return;
    let k = part.slice(0, i).trim(); const v = part.slice(i + 1).trim();
    if (!k) return;
    k = k.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
    o[k] = v;
  });
  return o;
}
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
async function waitFor(name, ms = 9000){
  const t = Date.now();
  while (!window[name]) { if (Date.now() - t > ms) throw new Error(name + ' 로드 실패'); await sleep(60); }
  return window[name];
}

/* ---- AI engine: Claude Design env first, then Anthropic API, else manual fallback ---- */
async function apiComplete(prompt, useSearch){
  const body = {
    model: "claude-sonnet-4-6",
    max_tokens: useSearch ? 4000 : 3000,
    messages: [{ role: "user", content: prompt }]
  };
  if (useSearch) body.tools = [{ type: "web_search_20250305", name: "web_search" }];
  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!resp.ok) throw new Error("API " + resp.status);
  const data = await resp.json();
  return (data.content || []).map(b => b.type === 'text' ? b.text : '').join('\n');
}
async function aiComplete(prompt){
  if (window.claude && typeof window.claude.complete === 'function') {
    return await window.claude.complete(prompt);
  }
  return await apiComplete(prompt, false);
}
/* URL/영상 콘텐츠 수집은 web_search 서버 도구가 필요 → 메시지 API 경로로만 동작 */
async function aiCompleteWithSearch(prompt){
  return await apiComplete(prompt, true);
}

/* 로컬(키워드) 자동 점검 — AI 엔진이 없어도 체크리스트가 즉시 자동으로 채워지게 한다.
   AI 스캔이 가능하면 이 결과를 더 정밀한 판정으로 덮어쓴다. */
function localScan(text){
  const t = String(text || '');
  const cats = [
    { key:'혐오·비하', type:3, level:'no',  items:['s1q2','s1q3','s3q3'], reason:'혐오·비하 표현 소지 — 수정 검토',
      terms:['병신','애비','맘충','김치녀','한남충','된장녀','틀딱','급식충','짱깨','쪽바리','전라디언','홍어','외노자','튀기','벙어리','귀머거리','절름발이','정신병자','분탕'] },
    { key:'젠더·사생활', type:3, level:'rec', items:['s1q3','s3q3'], reason:'연애·결혼·외모 등 사생활/젠더 감수성 — 대외 공개 시 톤 검토 권장',
      terms:['결혼','남자친구','여자친구','애인','연애','시집','장가','외모','몸매','노처녀','노총각','이상형'] },
    { key:'지역·사투리', type:4, level:'rec', items:['s1q2','s1q3','s3q3'], reason:'지역 고정관념·사투리 소재 — 대외 공개 시 톤 검토 권장',
      terms:['사투리','깡패','조폭','지역감정'] },
    { key:'정치·이념', type:2, level:'rec', items:['s3q3'], reason:'정치·이념 연상 소지 — 맥락 확인 권장',
      terms:['탄핵','국정농단','촛불집회','태극기','정권교체','종북'] },
    { key:'추모·참사', type:5, level:'rec', items:['s3q1','s3q2','s3q3'], reason:'국가적 추모·민감 사건 연상 — 배포 일자·맥락 확인 권장',
      terms:['세월호','4·16','4.16','이태원','10·29','10.29','5·18','5.18','광주민주화','4·3','위안부','참사'] },
    { key:'역사·외교', type:5, level:'rec', items:['s3q3'], reason:'역사·외교 마찰 소지 — 확인 권장',
      terms:['욱일기','전범기','독도','다케시마'] }
  ];
  const flags = [];
  const itemLevel = {};
  const itemEvidence = {};
  const seenCats = new Set();
  const seenTerm = new Set();
  for (const c of cats){
    const hits = [];
    for (const term of c.terms){
      if (term && t.indexOf(term) >= 0){
        hits.push(term);
        if (!seenTerm.has(term)){
          seenTerm.add(term);
          flags.push({ q: term, type:String(c.type), level:c.level, reason:c.reason });
        }
      }
    }
    if (hits.length){
      seenCats.add(c.key);
      const ev = '‘' + hits.join('·') + '’ — ' + c.reason;
      for (const id of c.items){
        if (c.level === 'no') itemLevel[id] = 'no';
        else if (itemLevel[id] !== 'no') itemLevel[id] = 'rec';
        (itemEvidence[id] = itemEvidence[id] || []).push(ev);
      }
    }
  }
  const idToKey = { s1q1:'1-1', s1q2:'1-2', s1q3:'1-3', s3q1:'3-1', s3q2:'3-2', s3q3:'3-3' };
  const checklist = {};
  ['s1q1','s1q2','s1q3','s3q1','s3q2','s3q3'].forEach(id => {
    const lv = itemLevel[id];
    const note = (itemEvidence[id] || []).join(' / ');
    checklist[idToKey[id]] = { a: lv === 'no' ? '수정필요' : lv === 'rec' ? '권고' : '적합', note: note };
  });
  if (seenCats.size >= 2 && checklist['3-2'].a === '적합') checklist['3-2'] = { a:'권고', note:'여러 민감 요소가 함께 등장 — 결합 맥락 확인 권장' };
  checklist['2-1'] = { a:'NA', note:'' };
  checklist['2-2'] = { a:'NA', note:'' };
  checklist['2-3'] = { a:'NA', note:'' };

  const vals = Object.values(itemLevel);
  const risk = vals.includes('no') ? '높음' : vals.includes('rec') ? '중간' : '낮음';
  const special = flags.length
    ? ('키워드 기반 자동 점검에서 확인이 필요한 표현 ' + flags.length + '건 발견(' + Array.from(seenCats).join(', ') + '). 시각 요소(이미지·제스처)는 육안 확인이 필요하며, 정밀 판정은 AI 스캔을 권장합니다.')
    : '키워드 기반 자동 점검에서는 뚜렷한 민감 표현이 발견되지 않았습니다. 맥락·시각 요소는 사람이 최종 확인하고, 정밀 판정은 AI 스캔을 권장합니다.';
  return { flags, checklist, special, risk, _local:true };
}

const TYPE_LABELS = {'1':'①산업안전','2':'②정치·이념','3':'③젠더·혐오','4':'④차별·소수자','5':'⑤역사·외교'};

/* 긴 내용을 문장 경계 기준으로 구간 분할 (전체를 빠짐없이 검증하기 위함) */
function chunkText(text, size){
  const t = String(text || '');
  const out = [];
  let i = 0;
  while (i < t.length){
    let end = Math.min(i + size, t.length);
    if (end < t.length){
      const seg = t.slice(i, end);
      const b = Math.max(seg.lastIndexOf('\n'), seg.lastIndexOf('. '), seg.lastIndexOf('。'), seg.lastIndexOf('! '), seg.lastIndexOf('? '), seg.lastIndexOf('니다.'));
      if (b > size * 0.5) end = i + b + 1;
    }
    out.push(t.slice(i, end));
    i = end;
  }
  return out.length ? out : [''];
}

/* 여러 구간(로컬+AI 청크)의 분석 결과를 병합 — 항목별로 가장 엄격한 판정을 채택 */
function mergeResults(results){
  const keys = ['1-1','1-2','1-3','2-1','2-2','2-3','3-1','3-2','3-3'];
  const sev = { '적합':0, '권고':1, '수정필요':2 };
  const riskRank = { '낮음':0, '중간':1, '높음':2 };
  const bestA = {}, notes = {}, specials = [], flags = [], seenQ = new Set();
  let maxRisk = 0, hasNonNA = false;
  for (const r of results){
    if (!r) continue;
    (r.flags || []).forEach(f => {
      if (f && f.q){ const key = String(f.q).trim(); if (key && !seenQ.has(key)){ seenQ.add(key); flags.push(f); } }
    });
    const cl = r.checklist || {};
    keys.forEach(k => {
      const c = cl[k]; if (!c) return;
      const a = String(c.a || '').trim();
      if (a && a !== 'NA'){
        hasNonNA = true;
        const rank = sev[a] != null ? sev[a] : 0;
        const cur = (bestA[k] && bestA[k] !== 'NA') ? (sev[bestA[k]] || 0) : -1;
        if (rank > cur) bestA[k] = a;
      } else if (!(k in bestA)) bestA[k] = 'NA';
      if (c.note){ (notes[k] = notes[k] || []); if (!notes[k].includes(c.note)) notes[k].push(c.note); }
    });
    if (r.special) specials.push(r.special);
    if (r.risk && riskRank[r.risk] != null) maxRisk = Math.max(maxRisk, riskRank[r.risk]);
  }
  const checklist = {};
  keys.forEach(k => {
    const a = bestA[k] || (k.indexOf('2-') === 0 ? 'NA' : '적합');
    checklist[k] = { a, note: (notes[k] || []).join(' / ') };
  });
  return {
    flags,
    checklist,
    special: Array.from(new Set(specials)).join(' '),
    risk: hasNonNA ? ['낮음','중간','높음'][maxRisk] : ''
  };
}

function App(){
  const [state, setStateRaw] = useState({
    contentType: 'blog',
    grade: 'general',
    files: [], images: [],
    extractedText: '', pastedText: '', url: '', urlText: '',
    dragOver: false, scanning: false, scanStage: '', scanned: false, aiError: '',
    flags: [], risk: '', special: '',
    reviewer: '', reviewDate: '', confirmed: false, guideOpen: false,
    items: INITIAL_ITEMS.map(it => ({ ...it }))
  });
  const ref = useRef(state); ref.current = state;
  const setState = (patch) =>
    setStateRaw(s => ({ ...s, ...(typeof patch === 'function' ? patch(s) : patch) }));

  useEffect(() => {
    const d = new Date();
    const ds = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    setState({ reviewDate: ds });
  }, []);

  /* ---------- helpers ---------- */
  const kindOf = (name) => {
    const e = (name.split('.').pop() || '').toLowerCase();
    if (['doc','docx'].includes(e)) return 'word';
    if (['ppt','pptx'].includes(e)) return 'ppt';
    if (e === 'pdf') return 'pdf';
    if (['mp4','mov','webm','m4v','avi'].includes(e)) return 'video';
    if (['png','jpg','jpeg','gif','webp','bmp'].includes(e)) return 'image';
    if (['txt','srt','vtt','md'].includes(e)) return 'text';
    return 'other';
  };
  const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

  /* ---------- extraction ---------- */
  async function extractDocx(file){
    const mammoth = await waitFor('mammoth');
    const res = await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
    return res.value || '';
  }
  async function extractPptx(file){
    const JSZip = await waitFor('JSZip');
    const zip = await JSZip.loadAsync(await file.arrayBuffer());
    const names = Object.keys(zip.files).filter(n => /ppt\/slides\/slide\d+\.xml$/.test(n))
      .sort((a,b)=> (a.match(/(\d+)/)[0]-b.match(/(\d+)/)[0]));
    const out = [];
    for (const n of names){
      const xml = await zip.files[n].async('string');
      const t = [...xml.matchAll(/<a:t>([\s\S]*?)<\/a:t>/g)].map(m=>m[1]).join(' ');
      if (t.trim()) out.push(t);
    }
    return out.join('\n');
  }
  async function extractPdf(file){
    const pdfjs = await waitFor('pdfjsLib');
    try { pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; } catch(e){}
    const pdf = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
    const out = [];
    const max = Math.min(pdf.numPages, 300);
    for (let i=1;i<=max;i++){
      const page = await pdf.getPage(i);
      const tc = await page.getTextContent();
      out.push(tc.items.map(it=>it.str).join(' '));
    }
    return out.join('\n');
  }
  const extractTextFile = (file) => file.text();
  function captureFrames(file){
    return new Promise((resolve)=>{
      const url = URL.createObjectURL(file);
      const v = document.createElement('video');
      v.src = url; v.muted = true; v.preload = 'metadata'; v.crossOrigin = 'anonymous';
      const frames = [];
      const fail = () => resolve(frames);
      v.onerror = fail;
      v.onloadedmetadata = () => {
        const dur = isFinite(v.duration) && v.duration > 0 ? v.duration : 0;
        const pts = dur ? [0.08,0.33,0.58,0.83].map(p=>Math.max(0.1, dur*p)) : [0.1];
        let i = 0;
        const seek = () => { if (i >= pts.length) { resolve(frames); return; } try { v.currentTime = pts[i]; } catch(e){ resolve(frames); } };
        v.onseeked = () => {
          try {
            const w = 320, h = Math.round(320 * (v.videoHeight||180)/(v.videoWidth||320));
            const c = document.createElement('canvas'); c.width = w; c.height = h;
            c.getContext('2d').drawImage(v, 0, 0, w, h);
            frames.push({ url: c.toDataURL('image/jpeg', 0.7), label: '프레임 @' + Math.round(pts[i]) + 's' });
          } catch(e){}

  function parseJson(raw){
    if (!raw) throw new Error('빈 응답');
    let s = raw.indexOf('{');
    let e = raw.lastIndexOf('}');
    if (s < 0) throw new Error('JSON 없음');
    let frag = raw.slice(s, e >= 0 ? e + 1 : undefined);
    try { return JSON.parse(frag); }
    catch(err){
      const le = frag.lastIndexOf('}');
      if (le > 0){ try { return JSON.parse(frag.slice(0, le+1)); } catch(e2){} }
      throw err;
    }
  }
  function normAns(v){
    const a = String(v||'').toLowerCase().trim();
    if (a==='적합' || a==='yes' || a==='ok' || a==='pass' || a==='문제없음') return 'yes';
    if (a==='권고' || a==='rec' || a==='review' || a==='주의' || a==='caution') return 'rec';
    if (a==='수정필요' || a==='수정' || a==='no' || a==='fail') return 'no';
    return null; // NA / 미정
  }
  function normLevel(v){
    const a = String(v||'').toLowerCase().trim();
    if (a==='권고' || a==='rec' || a==='review' || a==='caution' || a==='주의') return 'rec';
    return 'no';
  }
  function applyAI(json){
    const map = { s1q1:'1-1', s1q2:'1-2', s1q3:'1-3', s2q1:'2-1', s2q2:'2-2', s2q3:'2-3', s3q1:'3-1', s3q2:'3-2', s3q3:'3-3' };
    const cl = json.checklist || {};
    setState(s => ({
      flags: Array.isArray(json.flags) ? json.flags.filter(f=>f && f.q) : [],
      risk: json.risk || '',
      special: json.special || s.special,
      items: s.items.map(it => {
        const c = cl[map[it.id]];
        if (!c) return it;
        const ans = normAns(c.a);
        let reason = it.reason;
        if (ans === 'rec' || ans === 'no') reason = c.note ? c.note : it.reason;   // 권고·수정 → 사유 자동 기입
        else if (ans === 'yes') reason = '';                                        // 적합 → 사유 비움
        // ans === null (육안/NA) → 기존 입력 보존
        return { ...it, answer: ans, reason, byAI: true };
      })
    }));
  }

  const runScan = async () => {
    const cur = ref.current;
    const localText = ((cur.extractedText || '') + '\n' + (cur.pastedText || '')).trim();
    const hasImages = cur.images.length > 0;
    setState({ scanned: true, confirmed: false, aiError: '' });

    if (!localText){
      setState({
        scanning: false,
        aiError: hasImages
          ? '이미지만 업로드되었습니다. 이미지는 AI 자동 판정 대상이 아니므로 [2. 시각적 요소]를 육안으로 확인해 주세요. 자막·문구 텍스트가 있으면 붙여넣거나 함께 올리면 자동 분석됩니다.'
          : '분석할 콘텐츠가 없습니다. 파일을 업로드하거나 본문·스크립트를 붙여넣은 뒤 [검증 시작]을 누르세요.'
      });
      return;
    }

    // 1) 로컬 키워드 자동 점검 — 전체 텍스트를 즉시 점검(환경 무관).
    const localResult = localScan(localText);
    applyAI(localResult);

    // 2) AI 정밀 분석 — 길이에 상관없이 전체를 구간으로 나눠 빠짐없이 검증 후 병합.
    const CHUNK = 6000;      // 구간 크기(자)
    const MAX_CHUNKS = 20;   // 최대 구간 수 (~120,000자)
    const allChunks = chunkText(localText, CHUNK);
    const chunks = allChunks.slice(0, MAX_CHUNKS);
    setState({ scanning: true, scanStage: chunks.length > 1 ? ('AI가 전체 내용을 ' + chunks.length + '개 구간으로 정밀 분석 중…') : 'AI가 가이드 기준으로 정밀 분석 중…' });

    const parts = [localResult];  // 로컬(전체) 결과를 기본 포함 → AI 실패 구간도 누락되지 않음
    let anyFail = false;
    for (let ci = 0; ci < chunks.length; ci++){
      if (chunks.length > 1) setState({ scanStage: 'AI 정밀 분석 중… (' + (ci + 1) + '/' + chunks.length + ' 구간)' });
      try {
        const raw = await aiComplete(buildPrompt(chunks[ci]));
        parts.push(parseJson(raw));
      } catch(err){ anyFail = true; }
    }

    applyAI(mergeResults(parts));
    const anyOk = parts.length > 1;
    let note = '';
    if (!anyOk) note = '정밀 AI 분석은 현재 환경에서 사용할 수 없어, 키워드 기반 자동 점검 결과(전체 내용 적용)를 표시했습니다. 항목을 확인·보정해 주세요.';
    else if (allChunks.length > MAX_CHUNKS) note = '내용이 매우 길어 앞부분 약 ' + (MAX_CHUNKS * CHUNK).toLocaleString() + '자까지 AI 정밀 분석했습니다. (키워드 자동 점검은 전체에 적용됨)';
    else if (anyFail) note = '일부 구간의 AI 분석에 실패해 키워드 자동 점검 결과와 병합했습니다.';
    setState({ scanning: false, aiError: note });
  };

                  <div style={css('margin-top:16px; border-top:1px dashed #e1e7f0; padding-top:12px;')}>
                    <div style={css('font-size:12px; font-weight:700; color:#324158; margin-bottom:8px;')}>확인이 필요한 내용 {flagList.length}건</div>
                    <div style={css('display:flex; flex-direction:column; gap:7px;')}>
                      {flagList.map((f, idx) => {
                        const isRec = f.lvl === 'rec';
                        return (
                          <div key={idx} style={css('background:' + (isRec ? '#fffaf0' : '#fef6f5') + '; border:1px solid ' + (isRec ? '#ecd49a' : '#f5cdc8') + '; border-radius:7px; padding:8px 11px;')}>
                            <div style={css('font-size:12.5px; font-weight:700; color:' + (isRec ? '#9a6a00' : '#b42318') + ';')}>
                              <span style={css('font-size:10px;font-weight:800;padding:1px 7px;border-radius:10px;margin-right:6px;background:' + (isRec ? '#f6e2b8' : '#f7cdc8') + ';color:' + (isRec ? '#8a5d00' : '#a02018') + ';')}>{isRec ? '권고' : '수정'}</span>
                              {(typeLabelMap[f.type] || '확인') + ' · “' + f.q + '”'}
                            </div>
                            <div style={css('font-size:12px; color:#5b6577; margin-top:2px; line-height:1.5;')}>{f.reason}</div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                }
              </div>
            }
            {!s.scanning && !fullText &&
              <div style={css('display:flex; flex-direction:column; align-items:center; justify-content:center; height:200px; color:#aab2c0; gap:8px; text-align:center;')}>
                <div style={css('font-size:26px;')}>🔍</div>
                <div style={css('font-size:13px;')}>{s.aiError || '파일을 업로드하거나 본문·스크립트를 붙여넣고 [검증 시작]을 누르면 전체 내용에서 권고·수정 구간이 색으로 표기됩니다.'}</div>
              </div>
            }
          </div>
        </div>

        {/* Panel B: image / frames */}
        <div style={css('background:#fff; border:1px solid #dde3ec; border-radius:12px; overflow:hidden; box-shadow:0 1px 3px rgba(16,24,40,.04);')}>
          <div style={css('background:#f5f7fa; border-bottom:1px solid #e6eaf1; padding:11px 16px; font-size:13px; font-weight:700; color:#324158;')}>이미지 / 영상 프레임 · 육안 검토</div>
          <div style={css('padding:18px; min-height:240px; max-height:380px; overflow:auto;')}>
            {s.images.length > 0 &&
              <div>
                <div style={css('display:grid; grid-template-columns:1fr 1fr; gap:12px;')}>
                  {s.images.map((m, idx) =>
                    <div key={idx} style={css('position:relative; border-radius:8px; overflow:hidden; border:1px solid #e1e7f0; background:#f0f2f6;')}>
                      <img src={m.url} style={css('width:100%; height:120px; object-fit:cover; display:block;')} />
                      <span style={css('position:absolute; top:6px; left:6px; background:rgba(15,41,80,.8); color:#fff; font-size:10px; padding:2px 7px; border-radius:5px; font-weight:600;')}>{m.label}</span>
                    </div>
                  )}
                </div>
                <p style={css('margin:12px 0 0; font-size:11.5px; color:#8a94a6; line-height:1.5;')}>※ 이미지·제스처·문양·상징은 AI가 자동 판정하지 않습니다. 위 시각 자료를 직접 확인하여 <b style={css('color:#324158;')}>[2. 시각적 요소]</b> 항목을 체크하세요.</p>
              </div>
            }
            {s.images.length === 0 &&
              <div style={css('display:flex; flex-direction:column; align-items:center; justify-content:center; height:200px; color:#aab2c0; gap:8px;')}>
                <div style={css('font-size:26px;')}>🖼️</div>
                <div style={css('font-size:13px;')}>이미지·동영상 파일을 올리면 썸네일/프레임이 표기됩니다.</div>
              </div>
            }
          </div>
        </div>
      </div>

      {/* ===== STEP 3: CHECKLIST ===== */}
      <div style={css('display:flex; align-items:center; justify-content:space-between; margin:24px 2px 12px; flex-wrap:wrap; gap:8px;')}>
        <div style={css('display:flex; align-items:center; gap:10px;')}>
          <span style={css('background:#0f2950; color:#fff; font-size:12px; font-weight:700; width:22px; height:22px; border-radius:6px; display:flex; align-items:center; justify-content:center;')}>3</span>
          <span style={css('font-size:15px; font-weight:700; color:#0f2950;')}>사회적 민감 영역 체크리스트</span>
          <span style={css('font-size:12px; color:#5b6577; font-weight:600;')}>적합 · 권고 · 수정 자동 판정</span>
        </div>
        <div style={css('display:flex; align-items:center; gap:8px; flex-wrap:wrap;')}>
          <span style={css('font-size:12px; color:#5b6577;')}>진행 <b style={css('color:#0f2950;')}>{answeredCount}</b>/{s.items.length}</span>
          <span style={css('font-size:12px; background:#fff3df; color:#9a6a00; padding:3px 10px; border-radius:20px; font-weight:700;')}>권고 {recCount}</span>
          <span style={css('font-size:12px; background:#fef0ef; color:#b42318; padding:3px 10px; border-radius:20px; font-weight:700;')}>수정 {noCount}</span>
          <button onClick={toggleGuide} className="cc-guidebtn" style={css('border:1px solid #c9d2df; background:#fff; color:#324158; font-size:12px; font-weight:600; padding:6px 12px; border-radius:7px; cursor:pointer;')}>📖 검수 가이드</button>
        </div>
      </div>

      {s.guideOpen &&
        <div style={css('background:#0f2950; border-radius:12px; padding:18px 22px; margin-bottom:14px; color:#dbe6f5;')}>
          <div style={css('font-size:13px; font-weight:800; color:#fff; margin-bottom:10px;')}>5대 위험 유형 — 전방위 스캔 축</div>
          <div style={css('display:grid; grid-template-columns:1fr 1fr; gap:8px 24px; font-size:12.5px; line-height:1.55;')}>
            <div><b style={css('color:#fff;')}>① 재난·참사·산업안전</b> — 중대재해 위험요인 노출, 안전수칙 미준수, 화재·붕괴·대형 참사 연상</div>
            <div><b style={css('color:#fff;')}>② 정치·이념</b> — 진영 갈등 유발, 특정 정파 연상, 이념적 구호 차용</div>
            <div><b style={css('color:#fff;')}>③ 젠더·성·혐오</b> — 성차별·성적 대상화, 특정 성별 비하, 혐오 용어·제스처</div>
            <div><b style={css('color:#fff;')}>④ 차별·소수자</b> — 지역 비하·고정관념, 인종·국적 차별, 장애·약자·연령 조롱</div>
            <div style={css('grid-column:1/3;')}><b style={css('color:#fff;')}>⑤ 역사·외교·국제관계</b> — 역사적 비극·국가폭력(5·18, 세월호, 이태원, 4·3 등), 외교 마찰·통상 갈등 소지</div>
          </div>
        </div>
      }

      <div style={css('display:flex; flex-direction:column; gap:14px;')}>
        {sections.map((sec, si) =>
          <div key={si} style={css('background:#fff; border:1px solid #dde3ec; border-radius:12px; overflow:hidden; box-shadow:0 1px 3px rgba(16,24,40,.04);')}>
            <div style={css('background:#eaf0f8; padding:10px 18px; font-size:13.5px; font-weight:800; color:#0f2950; border-bottom:1px solid #dce4ef; display:flex; justify-content:space-between; align-items:center;')}>
              <span>{sec.title}</span>
              <span style={css(sec.tagStyle)}>{sec.tag}</span>
            </div>
            {sec.items.map((row) =>
              <div key={row.item.id} style={css(row.rowStyle)}>
                <div style={css('display:flex; gap:14px; align-items:flex-start;')}>
                  <span style={css('flex:none; width:24px; height:24px; border-radius:6px; background:#0f2950; color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px;')}>{row.item.no}</span>
                  <div style={css('flex:1; min-width:0;')}>
                    <div style={css('display:flex; align-items:center; gap:7px; margin-bottom:3px;')}>
                      <span style={css('font-size:14px; font-weight:700; color:#1f2c3f;')}>{row.item.title}</span>
                      <span style={css(row.badgeStyle)}>{row.badge}</span>
                    </div>
                    <div style={css('font-size:13px; color:#5b6577; line-height:1.5;')}>{row.item.q}</div>
                  </div>
                  <div style={css('flex:none; display:flex; gap:5px; margin-top:1px;')}>
                    <button onClick={() => setAnswer(row.item.id, 'yes')} style={css(row.yesStyle)}>적합</button>
                    <button onClick={() => setAnswer(row.item.id, 'rec')} style={css(row.recStyle)}>권고</button>
                    <button onClick={() => setAnswer(row.item.id, 'no')} style={css(row.noStyle)}>수정</button>
                  </div>
                </div>
                <textarea value={row.item.reason} onChange={(e) => setReason(row.item.id, e)} placeholder={row.reasonPlaceholder} style={css(row.reasonStyle)} />
              </div>
            )}
          </div>
        )}
      </div>

      {/* ===== STEP 4: SPECIAL NOTE ===== */}
      <div style={css('background:#fff; border:1px solid #dde3ec; border-radius:12px; padding:20px 22px; margin-top:18px; box-shadow:0 1px 3px rgba(16,24,40,.04);')}>
        <div style={css('display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap;')}>
          <span style={css('background:#0f2950; color:#fff; font-size:12px; font-weight:700; width:22px; height:22px; border-radius:6px; display:flex; align-items:center; justify-content:center;')}>4</span>
          <span style={css('font-size:15px; font-weight:700; color:#0f2950;')}>특이사항 (AI 자체 판단 + 검수자 의견)</span>
          <span style={css('font-size:11px;font-weight:700;padding:3px 11px;border-radius:20px;' + riskColor)}>{riskLabel}</span>
        </div>
        <textarea value={s.special} onChange={onSpecial} placeholder="체크리스트 외 확인이 필요한 사항, 교차 검수 의견을 적어주세요. (AI 스캔 시 자동 요약이 채워지며 직접 수정 가능합니다.)" style={css('width:100%; min-height:120px; border:1px solid #d3dae5; border-radius:8px; padding:13px 15px; font-size:13.5px; line-height:1.6; outline:none; resize:vertical;')} />
      </div>

      {/* ===== FOOTER: SIGN-OFF ===== */}
      <div style={css('background:linear-gradient(100deg,#0f2950,#1b4079); border-radius:12px; padding:18px 24px; margin-top:18px; display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;')}>
        <div style={css('display:flex; gap:22px; align-items:center; flex-wrap:wrap;')}>
          <div style={css('display:flex; flex-direction:column; gap:5px;')}>
            <label style={css('font-size:11px; color:#9fc0ef; font-weight:600;')}>검증 일자</label>
            <input type="date" value={s.reviewDate} onChange={onDate} style={css('border:none; border-radius:7px; padding:8px 11px; font-size:13px; background:rgba(255,255,255,.94); color:#1f2c3f; outline:none;')} />
          </div>
          <div style={css('display:flex; flex-direction:column; gap:5px;')}>
            <label style={css('font-size:11px; color:#9fc0ef; font-weight:600;')}>검수자</label>
            <input value={s.reviewer} onChange={onReviewer} placeholder="이름 입력" style={css('border:none; border-radius:7px; padding:8px 11px; font-size:13px; background:rgba(255,255,255,.94); color:#1f2c3f; outline:none; width:140px;')} />
          </div>
          <div style={css('display:flex; flex-direction:column; gap:5px;')}>
            <label style={css('font-size:11px; color:#9fc0ef; font-weight:600;')}>등급</label>
            <span style={css('font-size:13px; color:#fff; font-weight:700; padding:8px 0;')}>{s.grade === 'basic' ? '기본 · 사내' : '일반 · 대외'}</span>
          </div>
        </div>
        <div style={css('display:flex; gap:10px; flex-wrap:wrap;')}>
          <button onClick={exportReport} className="cc-export" style={css('border:1px solid rgba(255,255,255,.4); background:rgba(255,255,255,.12); color:#fff; border-radius:9px; padding:13px 20px; font-size:13.5px; font-weight:700; cursor:pointer;')}>📄 리포트 저장 (Word)</button>
          <button onClick={confirm} disabled={!confirmable} style={css(confirmBtnStyle)}>{s.confirmed ? '✓ 검증 확정됨' : '검증 확정'}</button>
        </div>
      </div>

      {/* ===== RESULT ===== */}
      {s.confirmed &&
        <div style={css('margin-top:16px;border-radius:12px;padding:20px 24px;border:1px solid ' + (resultState==='pass' ? '#bfe3cf' : resultState==='rec' ? '#ecd49a' : '#f5cdc8') + ';background:' + (resultState==='pass' ? '#f0faf4' : resultState==='rec' ? '#fffaf0' : '#fef6f5') + ';')}>
          <div style={css('display:flex; align-items:center; gap:12px; margin-bottom:10px;')}>
            <span style={css('font-size:22px;')}>{resultState==='pass' ? '✅' : resultState==='rec' ? '🟡' : '⚠️'}</span>
            <span style={css('font-size:16px; font-weight:800; color:' + (resultState==='pass' ? '#0f7b4f' : resultState==='rec' ? '#9a6a00' : '#b42318') + ';')}>
              {resultState==='pass'
                ? '검증 통과 — 업로드 가능'
                : resultState==='rec'
                  ? '검토 권장 — 권고 ' + recCount + '건 확인 후 업로드'
                  : '수정필요 ' + noCount + '건 — 보완 후 재검토'}
            </span>
          </div>
          <div style={css('font-size:13.5px; line-height:1.7; color:#324158;')}>
            {'검수자 ' + (s.reviewer || '-') + ' · ' + s.reviewDate + ' · ' + (s.grade === 'basic' ? '기본(사내)' : '일반(대외)') + ' 등급 · '
              + (resultState==='pass'
                  ? '체크리스트 9개 항목 전체 적합. 교차 검수자 확인 후 최종 파일을 공유하세요.'
                  : resultState==='rec'
                    ? '수정필요 항목은 없습니다. 권고(' + recCount + '건) 사유를 확인해 대외 공개 톤을 다듬으면 더 안전합니다. 사내 배포는 이대로도 무방합니다.'
                    : '수정필요 ' + noCount + '건의 사유를 반영해 콘텐츠를 보완하고, 일반(대외) 등급은 교차 검수까지 완료 후 업로드하세요.')}
          </div>
        </div>
      }

    </div>
  );
}

const boot = document.getElementById('__boot');
if (boot) boot.remove();
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
